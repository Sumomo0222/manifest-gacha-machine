<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>祝福显化扭蛋机 ✨ | 抽一张好运祝福</title>
<meta name="description" content="投入心愿币，转动旋钮，抽一张专属显化祝福卡。梦幻霓虹玩具店风格的互动祝福扭蛋机。" />
<meta property="og:title" content="祝福显化扭蛋机 ✨" />
<meta property="og:description" content="投入心愿币，转动旋钮，抽一张好运祝福卡 🔮" />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="blob pink"></div>
<div class="blob cyan"></div>
<div id="stars"></div>

<header class="site-head">
  <h1 class="title">祝福显化扭蛋机</h1>
  <p class="subtitle">🪙 投入心愿币 · 转动旋钮 · 🔮 开出今天的好运气</p>
</header>

<main class="scene">
  <div class="machine" id="machine">
    <!-- 招牌 -->
    <div class="sign" aria-hidden="true">
      <span class="screw s1"></span><span class="screw s2"></span>
      <div class="sign-main">显化 ✦ 扭蛋</div>
      <div class="sign-sub">WISH CAPSULE STATION</div>
      <span class="spark sp1">✦</span><span class="spark sp2">✧</span>
    </div>

    <!-- 玻璃罩 -->
    <div class="dome-wrap">
      <div class="dome" id="dome">
        <div class="dome-shine"></div>
        <div class="capsule" style="--x:13%;--y:24%;--cap:#ff6ec7;--fd:4.4s;--fdel:.3s;--tx:-6px;--ty:-13px;--tr:-42deg;--td:0s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
        <div class="capsule" style="--x:37%;--y:12%;--cap:#ffd257;--fd:5s;--fdel:.9s;--tx:8px;--ty:-12px;--tr:55deg;--td:.1s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
        <div class="capsule" style="--x:60%;--y:15%;--cap:#3ec9ff;--fd:4.1s;--fdel:.1s;--tx:-9px;--ty:-10px;--tr:-60deg;--td:.18s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
        <div class="capsule" style="--x:76%;--y:38%;--cap:#a86bff;--fd:4.7s;--fdel:.6s;--tx:7px;--ty:-15px;--tr:48deg;--td:.05s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
        <div class="capsule" style="--x:23%;--y:52%;--cap:#6ee7a0;--fd:4.3s;--fdel:1.2s;--tx:9px;--ty:-9px;--tr:-38deg;--td:.14s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
        <div class="capsule" style="--x:47%;--y:46%;--cap:#ff9d6e;--fd:5.2s;--fdel:.4s;--tx:-8px;--ty:-11px;--tr:40deg;--td:.22s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
        <div class="capsule small" style="--x:66%;--y:62%;--cap:#7dd3fc;--fd:4s;--fdel:1.5s;--tx:6px;--ty:-10px;--tr:-52deg;--td:.08s"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
      </div>
    </div>

    <!-- 机身：投币口 / 旋钮 / 出蛋口 -->
    <div class="body-wrap">
      <div class="collar"></div>
      <div class="body">
        <button class="coin-slot want" id="coinSlot" aria-label="投入心愿币">
          <span class="slot-plate"><span class="slot-slit"></span></span>
          <span class="slot-label">心愿币投币口 · ¥1</span>
        </button>
        <div class="knob-panel">
          <button class="knob idle" id="knob" aria-label="转动旋钮">
            <span class="pointer"></span><span class="ring"></span>
          </button>
          <span class="knob-label" id="knobLabel">投币可转</span>
        </div>
        <div class="outlet" id="outlet">
          <div class="outlet-hole">
            <span class="outlet-tag">出蛋口 · OUT</span>
            <div class="flap" id="flap"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 接蛋托盘 -->
    <div class="tray-row"><div class="tray" id="tray"></div></div>

    <!-- 底座 -->
    <div class="base">
      <span class="foot fl"></span><span class="foot fr"></span>
      <span class="base-plate">MANIFEST ✦ GO · TOY SHOP · EST. 2026</span>
    </div>
    <div class="ground-glow"></div>

    <!-- 掉落的胶囊 & 心愿币（动画元素） -->
    <div class="capsule-live" id="capsuleLive"><i class="top"></i><i class="bot"></i><i class="shine"></i></div>
    <div class="coin" id="coin"><span>wish</span></div>
  </div>

  <p class="hint" id="hint">🪙 点一下机器上的投币口，投下你的第一枚心愿币</p>
</main>

<footer class="foot-note">「显化」是提供情绪价值的创意互动，不承诺任何现实结果。<br />好运不在胶囊里，在你愿意行动的手里 🌱</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="祝福卡">
  <div class="card">
    <span class="card-deco d1">✦</span><span class="card-deco d2">✧</span>
    <div class="card-badge">🔮</div>
    <p class="card-tag">— 今日显化祝福 —</p>
    <h2 class="card-name" id="bName">星轨祝福</h2>
    <div class="card-row"><span class="row-ico">✨</span><div class="row-txt"><b>显化提示</b><p id="bTip"></p></div></div>
    <div class="card-row"><span class="row-ico">🌱</span><div class="row-txt"><b>今日小行动</b><p id="bAct"></p></div></div>
    <div class="card-share"><span class="row-ico">💌</span><p id="bShare"></p></div>
    <p class="card-sign">— 祝你拥有柔软明亮的一天 —</p>
    <div class="card-actions">
      <button class="ghost" id="copyBtn">📋 复制祝福</button>
      <button class="primary" id="againBtn">🎰 再抽一次</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制 ✨</div>
<button class="mute" id="muteBtn" aria-label="切换音效开关">🔊</button>

<script src="app.js"></script>
</body>
</html>
